<body>
  <!-- // EJERCICIO 1

    <!-- 
 Agregar elementos de formulario (inputs) de tipo texto para mostrar de forma visual el nombre, la estatura, el

  <!-- Crear una tabla HTML con una cabecera de tres columnas (Películas, Vehículos, Naves) y 
    una única fila preparada  para albergar los conteos numéricos. -->

  <table class="table">
    <thead class="thead-light">
      <tr>
        <th scope="col">Películas</th>
        <th scope="col">Vehículos</th>
        <th scope="col">Naves</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
      <!-- <tr>
        <td id="peliculas"></td>
        <td id="vehiculos"></td>
        <td id="naves"></td>
      </tr> -->
    </tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 2. Capturar los elementos del DOM en JavaScript:
      //   // - Obtener las referencias de JavaScript para el formulario, el input de entrada, los campos de visualización de los
      //   datos del personaje y la fila de la tabla donde se mostrarán los totales.
      const formulario = document.getElementById("formulario");
      const codigo = document.getElementById("codigo")
      const nombre = document.getElementById("nombre");
      const peso = document.getElementById("peso");
      const estatura = document.getElementById("estatura");
      const color = document.getElementById("color");
      const genero = document.getElementById("genero");
      const peliculas = document.getElementById("peliculas");
      const vehiculos = document.getElementById("vehiculos");
      const naves = document.getElementById("naves");
      const cuerpoTabla = document.getElementById("cuerpoTabla");

      function resetUI() {
        nombre.value = "";
        peso.value = "";
        estatura.value = "";
        color.value = "";
        genero.value = "";
        cuerpoTabla.innerHTML = "";
      }

      // 3. Escuchar el evento de envío:
      // - Registrar un controlador de eventos (event listener) para el evento submit del formulario y prevenir su
      //comportamiento por defecto de recargar la página.

      formulario.addEventListener("submit", (e) => {
        e.preventDefault();
        // 4. Validar el código ingresado:
        // - Leer el valor del input, convertirlo a un número entero y verificar que sea un valor válido mayor que cero antes
        // de proceder con la consulta.
        const idBuscado = parseInt(codigo.value);

        if (idBuscado <= 0) {
          //Función reinicie UI
          resetUI();
          console.error("ID incorrecto");
          return;
        }

        mostrarDatosPersonaje(idBuscado);
      });

      // 5. Realizar la petición asíncrona a la API:
      // - Construir la URL del endpoint correspondiente utilizando el código ingresado y realizar una petición HTTP
      // asíncrona para recibir la información en formato JSON.
      async function mostrarDatosPersonaje(id) {
        resetUI();
        // descripcion.innerText = "Cargando..."
        // animacion.setAttribute("class", "loader")

        const URL = `https://swapi.dev/api/people/${id}/`;
        const respuesta = await fetch(URL);

        // 6. Mapear y mostrar los datos en los inputs:
        // - Validar que la respuesta sea exitosa, extraer las propiedades correspondientes del objeto de datos y asignarlas a
        // la propiedad value de los inputs de visualización correspondientes (nombre, estatura, peso, color de cabello y
        // género).

        if (!respuesta.ok) {
          //Función reinicie UI
          resetUI();
          return;
        }



        ñ

        const datos = await respuesta.json();
        console.log(datos);

        nombre.value = datos.name;
        peso.value = datos.mass;
        estatura.value = datos.height;
        color.value = datos.hair_color;
        genero.value = datos.gender;

        // 7. Calcular y mostrar las codigoes en la tabla:
        // - Obtener la longitud de los arreglos o listas que representan las películas, los vehículos y las naves asociados
        // al personaje, y colocar estos números directamente en las celdas de la fila única de la tabla.

        // const filaTabla = document.querySelector(".table tbody tr");

        const totalPeliculas =
          datos.films && datos.films.length > 0 ? datos.films.length : 0;
        const totalVehiculos =
          datos.vehicles && datos.vehicles.length > 0
            ? datos.vehicles.length
            : 0;
        const totalNaves =
          datos.starships && datos.starships.length > 0
            ? datos.starships.length
            : 0;

        cuerpoTabla.innerHTML = `
         <tr>
  <td>${totalPeliculas}</td>
  <td>${totalVehiculos}</td>
  <td>${totalNaves}</td>
   </tr>
`;
      }
    });
  </script>
</body>
