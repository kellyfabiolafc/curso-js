<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars - Consulta de personajes</title>
    <link rel="stylesheet" href="./css/ejercicio1.css" />
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <h1>STAR WARS</h1>
            <p class="subtitulo">CONSULTA DE PERSONAJES</p>
        </header>
        <!-- 1. Formulario de búsqueda -->
        <form id="formulario">
            <label for="codigo">Código del personaje:</label>
            <div class="grupo-busqueda">
                <input type="text" id="codigo" inputmode="numeric" placeholder="Ingrese el código del personaje"
                    required />
                <button type="submit" id="btnBuscar">Buscar</button>
            </div>
        </form>
        <!-- Mensajes -->
        <p id="mensaje"></p>
        <!-- Loader -->
        <div id="loader">
            <div class="circulo-loader"></div>
            <p>Consultando personaje...</p>
        </div>
        <!-- 2. Formulario de resultados -->
        <form id="resultados">
            <h2>Datos del personaje</h2>
            <div class="campo campo-nombre">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" readonly />
            </div>
            <div class="campo">
                <label for="estatura">Estatura (cm):</label>
                <input type="text" id="estatura" readonly />
            </div>
            <div class="campo">
                <label for="peso">Peso (kg):</label>
                <input type="text" id="peso" readonly />
            </div>
            <div class="campo">
                <label for="color">Color de cabello:</label>
                <input type="text" id="color" readonly />
            </div>
            <div class="campo">
                <label for="genero">Género:</label>
                <input type="text" id="genero" readonly /
            </div>

            <!-- 3. Tabla HTML -->
            <div class="informacion-adicional">
                <h2>Información adicional</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Películas</th>
                            <th>Vehículos</th>
                            <th>Naves</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Obtener referencias a los elementos del DOM
            const formulario = document.getElementById("formulario");
            const codigo = document.getElementById("codigo");
            const nombre = document.getElementById("nombre");
            const estatura = document.getElementById("estatura");
            const peso = document.getElementById("peso");
            const color = document.getElementById("color");
            const genero = document.getElementById("genero");
            const cuerpoTabla = document.getElementById("cuerpoTabla");
            const resultados = document.getElementById("resultados");
            const mensaje = document.getElementById("mensaje");
            const loader = document.getElementById("loader");
            const btnBuscar = document.getElementById("btnBuscar");

            // 2. Limpiar resultados de la interfaz
            function resetUI() {
                nombre.value = "";
                estatura.value = "";
                peso.value = "";
                color.value = "";
                genero.value = "";
                cuerpoTabla.innerHTML = "";
                resultados.style.display = "none";
                mensaje.textContent = "";
            }

            // 3. Escuchar el envío del formulario al darle click al boton enviar
            formulario.addEventListener("submit", (e) => {
                e.preventDefault();

                const valor = codigo.value.trim();
                const idBuscado = Number(valor);

                // 4. Validar que el código sea un entero positivo usando una expresión regular
                if (
                    !/^[0-9]+$/.test(valor) ||
                    !Number.isSafeInteger(idBuscado) ||
                    idBuscado <= 0
                ) {
                    resetUI();
                    mensaje.textContent =
                        "Ingrese un código numérico entero mayor que cero.";
                    return;
                }

                mostrarDatosPersonaje(idBuscado);
            });

            // 5. Consulta asíncrona a la API
            async function mostrarDatosPersonaje(id) {
                resetUI();

                loader.style.display = "block";
                btnBuscar.disabled = true;

                try {
                    const URL = `https://swapi.dev/api/people/${id}/`;

                    const respuesta = await fetch(URL);

                    // Validar que el personaje exista
                    if (!respuesta.ok) {
                        if (respuesta.status === 404) {
                            mensaje.textContent =
                                "No se encontró un personaje con ese código.";
                            return;
                        }

                        throw new Error("Error al consultar el personaje");
                    }

                    const datos = await respuesta.json();

                    console.log("Datos del personaje:", datos);

                    // 6. Mostrar los datos en los inputs
                    nombre.value = datos.name ?? "Sin información";
                    estatura.value = datos.height ?? "Sin información";
                    peso.value = datos.mass ?? "Sin información";
                    color.value = datos.hair_color ?? "Sin información";
                    genero.value = datos.gender ?? "Sin información";

                    // 7. Calcular la cantidad de elementos
                    // Aplico programación defensiva usando encadenamiento opcional
                    // y fusión nula para evitar errores ante datos nulos o no definidos ya que algunas de estas claves contiene nulls .
                    const totalPeliculas = datos.films?.length ?? 0;
                    const totalVehiculos = datos.vehicles?.length ?? 0;
                    const totalNaves = datos.starships?.length ?? 0;

                    // 8. Mostrar una sola fila en la tabla
                    cuerpoTabla.innerHTML = `
            <tr>
              <td>${totalPeliculas}</td>
              <td>${totalVehiculos}</td>
              <td>${totalNaves}</td>
            </tr>
          `;

                    // 9. Mostrar el formulario de resultados
                    resultados.style.display = "grid";
                } catch (error) {
                    console.error("Error en la consulta:", error);

                    mensaje.textContent =
                        "No se pudo completar la consulta. Intente nuevamente.";
                } finally {
                    // Ocultar loader y habilitar botón
                    loader.style.display = "none";
                    btnBuscar.disabled = false;
                }
            }
        });
    </script>
</body>

</html>
