<!doctype html>
<html lang="es" data-theme="light">

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
</head>

<body>
  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <form action="" id="formulario" autocomplete="off">
          <div class="field">
            <label class="label" for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" minlength="3" required />
          </div>

          <div>
            <label class="label"  for="nombres" minlength="3">Nombres</label>
            <input type="text" id="nombres" />
          </div>

          <div class="field">
            <label class="label"  for="fecha">Fecha nacimiento</label>
            <input type="date" id="fecha" min="1998-12-31" />
          </div>

          <div class="field">
            <label class="label"   for="email">Correo electrónico</label>
            <input type="email" id="email" />
          </div>

          <div class="field">
            <label class="label"  for="experiencia">Experiencia</label>
            <input type="text" id="experiencia" />
          </div>
          <div class="field">
            <label class="label"   for="cargo">Cargo</label>
            <select class="select is-fullwitdh" name="cargo" id="cargo">
              <option value="">Seleccione</option>
              <option value="1">Analista</option>
              <option value="2">Programador</option>
              <option value="3">Jefe</option>
            </select>
          </div>
          <div>
            <button type="submit" class="button is-link">Enviar</button>
            <button type="reset">Reiniciar</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script>
    const formulario = document.getElementById("formulario");

    formulario.addEventListener("submit", function (event) {
      // Evitar el envío automático del formulario
      event.preventDefault();

      if (confirm("¿Está seguro de proceder?")) {
        formulario.submit();
      }
    });
  </script>
</body>

</html>
